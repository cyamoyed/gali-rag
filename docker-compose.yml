services:
  backend:
    build: .
    restart: unless-stopped
    volumes:
      - gali-db:/app/data
      - gali-chroma:/app/data/chroma
      - ./data/uploads:/app/data/uploads
      - ./data/exports:/app/data/exports
    env_file: .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  gali-db:
  gali-chroma:
